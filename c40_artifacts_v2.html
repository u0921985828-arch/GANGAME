<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C40 ARTIFACTS — Caja de Ritmos Sostenible</title>
<style>
  :root{
    --kraft:#d9cdb1;
    --kraft-dk:#c3b48d;
    --ink:#26221b;
    --shell:#4a4638;
    --shell-dk:#38352a;
    --moss:#5b6b47;
    --moss-lt:#7c8f5f;
    --rust:#a34a2c;
    --cream:#f1e9d4;
    --line: rgba(38,34,27,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 800px at 10% -10%, rgba(255,255,255,0.10), transparent 60%),
      repeating-linear-gradient(115deg, rgba(38,34,27,0.035) 0 2px, transparent 2px 6px),
      var(--kraft);
    color:var(--ink);
    font-family: ui-monospace, "SF Mono", "Courier New", monospace;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:18px 12px 60px;
    user-select:none;
  }
  .device{
    width:100%;
    max-width:560px;
  }

  /* ---------- HEADER / STAMP ---------- */
  .brandrow{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:10px;
    padding:0 2px;
  }
  .brand{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:800;
    font-style:italic;
    letter-spacing:0.5px;
    font-size:26px;
    color:var(--ink);
  }
  .brand small{
    display:block;
    font-family: ui-monospace, monospace;
    font-style:normal;
    font-weight:700;
    font-size:9.5px;
    letter-spacing:2.5px;
    color:var(--moss);
    margin-top:2px;
  }
  .stamp{
    border:2px solid var(--rust);
    color:var(--rust);
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
    padding:4px 6px;
    border-radius:3px;
    transform:rotate(-4deg);
    line-height:1.25;
    text-align:center;
    white-space:nowrap;
  }

  /* ---------- CASSETTE WINDOW (hero / signature) ---------- */
  .cassette{
    background:linear-gradient(180deg, var(--shell), var(--shell-dk));
    border-radius:14px;
    padding:14px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 6px 16px rgba(0,0,0,0.25);
    position:relative;
    overflow:hidden;
  }
  .cassette::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .screw{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #8b8571, #2c2a22 70%);
    box-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .screw.tl{top:8px;left:8px;} .screw.tr{top:8px;right:8px;}
  .screw.bl{bottom:8px;left:8px;} .screw.br{bottom:8px;right:8px;}

  .tapewin{
    background: var(--cream);
    border-radius:8px;
    padding:14px 16px 10px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
    position:relative;
  }
  .reels{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 18px 10px;
  }
  .reel{
    width:56px;height:56px;border-radius:50%;
    background: repeating-conic-gradient(var(--ink) 0deg 8deg, var(--cream) 8deg 24deg);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px var(--ink), inset 0 0 0 2px var(--cream);
  }
  .reel::after{
    content:"";width:14px;height:14px;border-radius:50%;
    background:var(--cream); box-shadow:0 0 0 2px var(--ink);
  }
  .reel.spin{ animation: spin 1.4s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){
    .reel.spin{ animation: none; }
  }

  .tapeline{
    height:2px;background:var(--ink); opacity:0.6; margin:0 26px;
  }
  .readout{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px; padding:0 4px;
    font-size:11px; letter-spacing:1px; color:var(--shell);
  }
  .counter{
    font-size:20px; font-weight:700; letter-spacing:2px; color:var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .sidelabel{
    font-family: Georgia, serif; font-style:italic; font-weight:700;
    font-size:13px; text-align:center; letter-spacing:1px; color:var(--shell);
    margin-top:2px;
  }
  .sidelabel span{color:var(--rust);}

  /* ---------- TRANSPORT ---------- */
  .transport{
    display:flex; align-items:center; gap:8px;
    margin-top:12px; flex-wrap:wrap;
  }
  .tbtn{
    border:none; border-radius:8px; padding:10px 14px;
    font-family:inherit; font-weight:700; font-size:11px; letter-spacing:1.5px;
    cursor:pointer; color:var(--cream); background:var(--shell);
    box-shadow: 0 3px 0 var(--shell-dk);
    transition: transform .05s ease;
  }
  .tbtn:active{ transform: translateY(2px); box-shadow:0 1px 0 var(--shell-dk); }
  .tbtn.play{ background:var(--moss); box-shadow:0 3px 0 #43502f; }
  .tbtn.play.on{ background:var(--moss-lt); }
  .tbtn.rec{ background:var(--rust); box-shadow:0 3px 0 #7a3520; }
  .tbtn.rec.on{ background:#c85a37; }
  .tbtn:focus-visible, .pad:focus-visible, .step:focus-visible,
  .bpmbox button:focus-visible, .seqtoggle:focus-visible, input:focus-visible{
    outline:3px solid var(--ink); outline-offset:2px;
  }
  .bpmbox{
    display:flex; align-items:center; gap:6px;
    background:var(--cream); border-radius:8px; padding:6px 10px;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .bpmbox button{
    width:22px;height:22px;border:none;border-radius:5px;background:var(--shell);
    color:var(--cream); font-weight:800; cursor:pointer;
  }
  .bpmval{ font-weight:700; font-size:13px; min-width:56px; text-align:center; }
  .volbox{
    display:flex; align-items:center; gap:6px; margin-left:auto;
    font-size:10px; letter-spacing:1px; color:var(--shell);
  }
  .volbox input{accent-color:var(--rust); width:70px;}

  /* ---------- PADS ---------- */
  .padgrid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:9px;
    margin-top:14px;
  }
  .pad{
    aspect-ratio:1/0.8;
    border:none; border-radius:9px;
    background: linear-gradient(180deg, var(--kraft-dk), var(--kraft));
    box-shadow: 0 3px 0 rgba(38,34,27,0.4), inset 0 0 0 1px rgba(38,34,27,0.15);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; cursor:pointer; position:relative; color:var(--ink);
    font-family:inherit;
  }
  .pad:active, .pad.hit{
    transform:translateY(2px);
    box-shadow: 0 1px 0 rgba(38,34,27,0.4), inset 0 0 0 1px rgba(38,34,27,0.15);
    background: linear-gradient(180deg, var(--moss-lt), var(--moss));
    color:var(--cream);
  }
  .pad .key{
    position:absolute; top:5px; left:7px; font-size:9px; opacity:0.55; font-weight:700;
  }
  .pad .name{ font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-align:center; }
  .pad .num{ font-size:8px; opacity:0.5; letter-spacing:1px;}
  .pad.seqon{ box-shadow: 0 3px 0 rgba(38,34,27,0.4), inset 0 0 0 2px var(--rust); }

  /* ---------- SEQUENCER ---------- */
  .seqtoggle{
    margin-top:14px; width:100%; text-align:left;
    background:none; border:none; border-top:2px dashed var(--line);
    padding-top:10px; font-family:inherit; font-weight:700; font-size:11px;
    letter-spacing:1.5px; color:var(--shell); cursor:pointer;
  }
  .seqtoggle::before{content:"▸ "; color:var(--rust);}
  .seqtoggle.open::before{content:"▾ ";}
  .seqwrap{ display:none; margin-top:10px; overflow-x:auto; padding-bottom:6px;}
  .seqwrap.open{ display:block; }
  .seqrow{
    display:flex; align-items:center; gap:4px; margin-bottom:4px; min-width:640px;
  }
  .seqrow .rlabel{
    width:70px; flex:0 0 70px; font-size:9px; font-weight:700; letter-spacing:0.5px;
    color:var(--shell); text-align:right; padding-right:4px;
  }
  .step{
    width:32px; height:22px; border-radius:4px; border:none; cursor:pointer;
    background:var(--kraft-dk); box-shadow: inset 0 0 0 1px var(--line);
  }
  .step.beat{ background:#cbbd97; }
  .step.on{ background:var(--rust); }
  .step.playing{ outline:2px solid var(--ink); outline-offset:1px; }

  .foot{
    margin-top:16px; text-align:center; font-size:9px; letter-spacing:1.5px;
    color:var(--shell); opacity:0.7;
  }
  .visually-hidden{
    position:absolute !important; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>
<div class="device">

  <div class="brandrow">
    <div class="brand">C40 Artifacts<small>CAJA DE RITMOS · EDICIÓN SOSTENIBLE</small></div>
    <div class="stamp">100%<br>RECICLADO<br>NO.040</div>
  </div>

  <div class="cassette">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <div class="tapewin">
      <div class="reels">
        <div class="reel" id="reelL"></div>
        <div class="reel" id="reelR"></div>
      </div>
      <div class="tapeline"></div>
      <div class="sidelabel">LADO <span>A</span> — RITMO EN VIVO</div>
      <div class="readout">
        <span id="statusTxt" role="status" aria-live="polite">DETENIDO</span>
        <span class="counter" id="counter" aria-label="Tiempo transcurrido">00:00</span>
      </div>
    </div>
  </div>

  <div class="transport">
    <button class="tbtn play" id="playBtn" aria-pressed="false">▶ REPRODUCIR</button>
    <button class="tbtn rec" id="recBtn" aria-pressed="false" title="Graba tus golpes en el paso que suena">● GRABAR PASO</button>
    <button class="tbtn" id="clearBtn">LIMPIAR</button>
    <div class="bpmbox">
      <button id="bpmDown" aria-label="Bajar tempo">−</button>
      <span class="bpmval" id="bpmVal" role="status" aria-live="polite" aria-label="Tempo">96 BPM</span>
      <button id="bpmUp" aria-label="Subir tempo">+</button>
    </div>
    <div class="volbox">
      <label for="volSlider">VOL</label>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.85" aria-label="Volumen general">
    </div>
  </div>

  <div class="padgrid" id="padGrid"></div>

  <button class="seqtoggle" id="seqToggle" aria-expanded="false" aria-controls="seqWrap">SECUENCIADOR — 16 PASOS</button>
  <div class="seqwrap" id="seqWrap">
    <div id="seqRows"></div>
  </div>

  <div class="foot">FABRICADO CON MATERIALES DIGITALES REUTILIZADOS · SIN MUESTRAS EXTERNAS · 100% SÍNTESIS</div>
</div>

<script>
(function(){
  "use strict";

  // ---------- CONFIG: 16 pads, cada uno con su síntesis propia ----------
  const PADS = [
    {id:'kick',  name:'BOMBO',      key:'1'},
    {id:'snare', name:'CAJA',       key:'2'},
    {id:'chat',  name:'HI-HAT C',   key:'3'},
    {id:'ohat',  name:'HI-HAT A',   key:'4'},
    {id:'clap',  name:'PALMA',      key:'Q'},
    {id:'tomlo', name:'TOM GRAVE',  key:'W'},
    {id:'tommid',name:'TOM MEDIO',  key:'E'},
    {id:'tomhi', name:'TOM AGUDO',  key:'R'},
    {id:'rim',   name:'RIM',        key:'A'},
    {id:'cowb',  name:'CAMPANA',    key:'S'},
    {id:'perc1', name:'PERC. 1',    key:'D'},
    {id:'perc2', name:'PERC. 2',    key:'F'},
    {id:'crash', name:'PLATILLO',   key:'Z'},
    {id:'ride',  name:'RIDE',       key:'X'},
    {id:'shake', name:'MARACA',     key:'C'},
    {id:'clave', name:'CLAVE',      key:'V'},
  ];
  const STEPS = 16;
  const STORE_KEY = 'c40.artifacts.v2';

  // ---------- AUDIO ENGINE ----------
  let actx = null;
  let masterGain = null;
  function ensureAudio(){
    if(!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain();
      masterGain.gain.value = parseFloat(document.getElementById('volSlider').value);
      masterGain.connect(actx.destination);
    }
    if(actx.state === 'suspended') actx.resume();
  }

  function noiseBuffer(duration){
    const len = Math.max(1, Math.floor(actx.sampleRate * duration));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return buf;
  }

  function env(node, t0, attack, decay, peak){
    node.gain.cancelScheduledValues(t0);
    node.gain.setValueAtTime(0.0001, t0);
    node.gain.linearRampToValueAtTime(peak, t0+attack);
    node.gain.exponentialRampToValueAtTime(0.0001, t0+attack+decay);
  }

  // Hi-hat choke group: a closed hat cuts a ringing open hat, like a real machine.
  let openHatGain = null;
  function chokeOpenHat(t){
    if(openHatGain){
      try{
        openHatGain.gain.cancelScheduledValues(t);
        openHatGain.gain.setValueAtTime(Math.max(0.0001, openHatGain.gain.value), t);
        openHatGain.gain.exponentialRampToValueAtTime(0.0001, t+0.02);
      }catch(_){/* node already finished */}
      openHatGain = null;
    }
  }

  const SYNTH = {
    kick(t){
      const osc = actx.createOscillator(); const g = actx.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(45, t+0.25);
      g.gain.setValueAtTime(1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.32);
      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t+0.35);
    },
    snare(t){
      const nb = actx.createBufferSource(); nb.buffer = noiseBuffer(0.3);
      const nf = actx.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=1200;
      const ng = actx.createGain(); env(ng,t,0.001,0.18,0.9);
      nb.connect(nf); nf.connect(ng); ng.connect(masterGain);
      const osc = actx.createOscillator(); osc.type='triangle'; osc.frequency.value=180;
      const og = actx.createGain(); env(og,t,0.001,0.12,0.5);
      osc.connect(og); og.connect(masterGain);
      nb.start(t); nb.stop(t+0.3); osc.start(t); osc.stop(t+0.15);
    },
    chat(t){
      chokeOpenHat(t);
      const nb = actx.createBufferSource(); nb.buffer = noiseBuffer(0.08);
      const f = actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
      const g = actx.createGain(); env(g,t,0.001,0.05,0.55);
      nb.connect(f); f.connect(g); g.connect(masterGain);
      nb.start(t); nb.stop(t+0.08);
    },
    ohat(t){
      const nb = actx.createBufferSource(); nb.buffer = noiseBuffer(0.35);
      const f = actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
      const g = actx.createGain(); env(g,t,0.001,0.28,0.45);
      nb.connect(f); f.connect(g); g.connect(masterGain);
      nb.start(t); nb.stop(t+0.35);
      openHatGain = g; // registered so a closed hat can choke it
    },
    clap(t){
      for(let i=0;i<3;i++){
        const dt = t + i*0.018;
        const nb = actx.createBufferSource(); nb.buffer = noiseBuffer(0.05);
        const f = actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=2;
        const g = actx.createGain(); env(g,dt,0.001,0.05,0.6);
        nb.connect(f); f.connect(g); g.connect(masterGain);
        nb.start(dt); nb.stop(dt+0.06);
      }
    },
    tomlo(t){ tom(t,110); }, tommid(t){ tom(t,165); }, tomhi(t){ tom(t,235); },
    rim(t){
      const osc = actx.createOscillator(); osc.type='square'; osc.frequency.value=1400;
      const g = actx.createGain(); env(g,t,0.001,0.04,0.35);
      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t+0.05);
    },
    cowb(t){
      [540,800].forEach(f=>{
        const osc = actx.createOscillator(); osc.type='square'; osc.frequency.value=f;
        const g = actx.createGain(); env(g,t,0.001,0.22,0.28);
        osc.connect(g); g.connect(masterGain);
        osc.start(t); osc.stop(t+0.25);
      });
    },
    perc1(t){
      const osc = actx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(900,t); osc.frequency.exponentialRampToValueAtTime(300,t+0.1);
      const g = actx.createGain(); env(g,t,0.001,0.12,0.5);
      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t+0.13);
    },
    perc2(t){
      const osc = actx.createOscillator(); osc.type='triangle';
      osc.frequency.setValueAtTime(1200,t); osc.frequency.exponentialRampToValueAtTime(500,t+0.08);
      const g = actx.createGain(); env(g,t,0.001,0.09,0.45);
      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t+0.1);
    },
    crash(t){
      const nb = actx.createBufferSource(); nb.buffer = noiseBuffer(1.1);
      const f = actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=5000;
      const g = actx.createGain(); env(g,t,0.001,0.9,0.4);
      nb.connect(f); f.connect(g); g.connect(masterGain);
      nb.start(t); nb.stop(t+1.1);
    },
    ride(t){
      const nb = actx.createBufferSource(); nb.buffer = noiseBuffer(0.5);
      const f = actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=6000; f.Q.value=1.2;
      const g = actx.createGain(); env(g,t,0.001,0.4,0.3);
      nb.connect(f); f.connect(g); g.connect(masterGain);
      nb.start(t); nb.stop(t+0.5);
    },
    shake(t){
      const nb = actx.createBufferSource(); nb.buffer = noiseBuffer(0.12);
      const f = actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=4500; f.Q.value=0.8;
      const g = actx.createGain(); env(g,t,0.005,0.1,0.35);
      nb.connect(f); f.connect(g); g.connect(masterGain);
      nb.start(t); nb.stop(t+0.12);
    },
    clave(t){
      const osc = actx.createOscillator(); osc.type='square'; osc.frequency.value=2500;
      const g = actx.createGain(); env(g,t,0.001,0.05,0.3);
      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t+0.06);
    }
  };
  function tom(t, freq){
    const osc = actx.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(freq,t); osc.frequency.exponentialRampToValueAtTime(freq*0.6,t+0.2);
    const g = actx.createGain(); env(g,t,0.001,0.22,0.7);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t+0.25);
  }

  function trigger(padId, when){
    ensureAudio();
    const t = when || actx.currentTime;
    if(SYNTH[padId]) SYNTH[padId](t);
  }

  // ---------- STATE ----------
  const pattern = {}; // padId -> array(STEPS) booleans
  PADS.forEach(p => pattern[p.id] = new Array(STEPS).fill(false));

  let bpm = 96;
  let playing = false;
  let recording = false;
  let currentStep = 0;
  let nextNoteTime = 0;
  let lookaheadTimer = null;
  let startedAt = 0;
  const LOOKAHEAD = 25.0;      // ms
  const SCHEDULE_AHEAD = 0.1;  // s
  const FIRST_OFFSET = 0.05;   // s — delay before the first step after pressing play

  function stepDuration(){ return 60.0 / bpm / 4; } // 16th notes

  // Step currently audible/visible, derived from the audio clock. This is what a
  // live-recorded hit must land on — NOT `currentStep`, which the look-ahead
  // scheduler has already advanced up to SCHEDULE_AHEAD into the future.
  function soundingStep(){
    if(!actx) return 0;
    const k = Math.round((actx.currentTime - startedAt - FIRST_OFFSET) / stepDuration());
    return ((k % STEPS) + STEPS) % STEPS;
  }

  // ---------- PERSISTENCE ----------
  function saveState(){
    try{
      const packed = {};
      PADS.forEach(p => packed[p.id] = pattern[p.id].map(v => v ? 1 : 0));
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v:2, bpm, vol: parseFloat(document.getElementById('volSlider').value), pattern: packed
      }));
    }catch(_){/* storage unavailable (private mode, sandbox) — non-fatal */}
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data || typeof data !== 'object' || !data.pattern) return null;
      return data;
    }catch(_){ return null; }
  }

  // ---------- UI BUILD ----------
  const padGrid = document.getElementById('padGrid');
  const padEls = {};
  PADS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'pad';
    btn.type = 'button';
    btn.dataset.pad = p.id;
    btn.setAttribute('aria-label', p.name + ' (tecla ' + p.key + ')');
    btn.innerHTML = `<span class="key" aria-hidden="true">${p.key}</span><span class="name">${p.name}</span><span class="num" aria-hidden="true">${String(i+1).padStart(2,'0')}</span>`;
    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); hitPad(p.id, btn); });
    padGrid.appendChild(btn);
    padEls[p.id] = btn;
  });

  const seqRows = document.getElementById('seqRows');
  const stepEls = {}; // padId -> array of button els
  PADS.forEach(p => {
    const row = document.createElement('div');
    row.className = 'seqrow';
    const label = document.createElement('div');
    label.className = 'rlabel';
    label.textContent = p.name;
    row.appendChild(label);
    stepEls[p.id] = [];
    for(let s=0;s<STEPS;s++){
      const st = document.createElement('button');
      st.type = 'button';
      st.className = 'step' + ((s%4===0) ? ' beat' : '');
      st.setAttribute('aria-label', p.name + ' paso ' + (s+1));
      st.setAttribute('aria-pressed', 'false');
      st.addEventListener('click', () => {
        pattern[p.id][s] = !pattern[p.id][s];
        st.classList.toggle('on', pattern[p.id][s]);
        st.setAttribute('aria-pressed', String(pattern[p.id][s]));
        padEls[p.id].classList.toggle('seqon', pattern[p.id].some(v=>v));
        saveState();
      });
      row.appendChild(st);
      stepEls[p.id].push(st);
    }
    seqRows.appendChild(row);
  });

  function syncRowUI(padId){
    const on = pattern[padId];
    on.forEach((v, s) => {
      stepEls[padId][s].classList.toggle('on', v);
      stepEls[padId][s].setAttribute('aria-pressed', String(v));
    });
    padEls[padId].classList.toggle('seqon', on.some(v=>v));
  }

  document.getElementById('seqToggle').addEventListener('click', function(){
    const open = this.classList.toggle('open');
    document.getElementById('seqWrap').classList.toggle('open', open);
    this.setAttribute('aria-expanded', String(open));
  });

  function hitPad(padId, el){
    ensureAudio();
    trigger(padId);
    el.classList.add('hit');
    setTimeout(()=>el.classList.remove('hit'), 90);
    if(recording && playing){
      const s = soundingStep();
      pattern[padId][s] = true;
      stepEls[padId][s].classList.add('on');
      stepEls[padId][s].setAttribute('aria-pressed', 'true');
      padEls[padId].classList.add('seqon');
      saveState();
    }
  }

  // keyboard mapping
  const keyMap = {};
  PADS.forEach(p => keyMap[p.key.toLowerCase()] = p.id);
  window.addEventListener('keydown', (e) => {
    if(e.repeat) return; // ignore auto-repeat: no machine-gun transport toggles or pad retriggers
    // Let the space bar drive transport without also "clicking" a focused control.
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); return; }
    const id = keyMap[e.key.toLowerCase()];
    if(id){ e.preventDefault(); hitPad(id, padEls[id]); }
  });

  // ---------- TRANSPORT ----------
  const playBtn = document.getElementById('playBtn');
  const recBtn = document.getElementById('recBtn');
  const clearBtn = document.getElementById('clearBtn');
  const bpmVal = document.getElementById('bpmVal');
  const statusTxt = document.getElementById('statusTxt');
  const counter = document.getElementById('counter');
  const reelL = document.getElementById('reelL');
  const reelR = document.getElementById('reelR');
  const volSlider = document.getElementById('volSlider');

  volSlider.addEventListener('input', () => {
    // keep audio responsive on every drag frame...
    if(masterGain) masterGain.gain.value = parseFloat(volSlider.value);
  });
  // ...but only persist once the drag settles, to avoid a localStorage write storm.
  volSlider.addEventListener('change', saveState);

  document.getElementById('bpmDown').addEventListener('click', () => setBpm(bpm-4));
  document.getElementById('bpmUp').addEventListener('click', () => setBpm(bpm+4));
  function setBpm(v, skipSave){
    bpm = Math.max(60, Math.min(200, v));
    bpmVal.textContent = bpm + ' BPM';
    if(!skipSave) saveState();
  }

  clearBtn.addEventListener('click', () => {
    PADS.forEach(p => {
      pattern[p.id].fill(false);
      stepEls[p.id].forEach(el => { el.classList.remove('on'); el.setAttribute('aria-pressed','false'); });
      padEls[p.id].classList.remove('seqon');
    });
    saveState();
  });

  recBtn.addEventListener('click', () => {
    recording = !recording;
    recBtn.classList.toggle('on', recording);
    recBtn.setAttribute('aria-pressed', String(recording));
  });

  playBtn.addEventListener('click', togglePlay);

  function togglePlay(){
    ensureAudio();
    playing = !playing;
    playBtn.classList.toggle('on', playing);
    playBtn.setAttribute('aria-pressed', String(playing));
    playBtn.textContent = playing ? '■ DETENER' : '▶ REPRODUCIR';
    statusTxt.textContent = playing ? 'REPRODUCIENDO' : 'DETENIDO';
    reelL.classList.toggle('spin', playing);
    reelR.classList.toggle('spin', playing);
    if(playing){
      currentStep = 0;
      nextNoteTime = actx.currentTime + FIRST_OFFSET;
      startedAt = actx.currentTime;
      scheduler();
    } else {
      clearTimeout(lookaheadTimer);
      clearAllPlayheads();
    }
  }

  function clearAllPlayheads(){
    PADS.forEach(p => stepEls[p.id].forEach(el => el.classList.remove('playing')));
  }

  function scheduleStep(step, time){
    PADS.forEach(p => {
      if(pattern[p.id][step]) trigger(p.id, time);
    });
    // visual playhead + counter, synced via setTimeout to audio time
    const delayMs = Math.max(0, (time - actx.currentTime) * 1000);
    setTimeout(() => {
      if(!playing) return;
      clearAllPlayheads();
      PADS.forEach(p => stepEls[p.id][step].classList.add('playing'));
      const elapsed = actx.currentTime - startedAt;
      const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
      const ss = String(Math.floor(elapsed%60)).padStart(2,'0');
      counter.textContent = mm+':'+ss;
    }, delayMs);
  }

  function scheduler(){
    while(nextNoteTime < actx.currentTime + SCHEDULE_AHEAD){
      scheduleStep(currentStep, nextNoteTime);
      nextNoteTime += stepDuration();
      currentStep = (currentStep+1) % STEPS;
    }
    lookaheadTimer = setTimeout(scheduler, LOOKAHEAD);
  }

  // ---------- INITIAL PATTERN: restore saved beat, else a light demo ----------
  function setSteps(padId, steps){
    steps.forEach(s => { pattern[padId][s]=true; });
    syncRowUI(padId);
  }

  const saved = loadState();
  if(saved){
    PADS.forEach(p => {
      const arr = saved.pattern[p.id];
      if(Array.isArray(arr)){
        for(let s=0;s<STEPS;s++) pattern[p.id][s] = !!arr[s];
      }
      syncRowUI(p.id);
    });
    if(typeof saved.bpm === 'number') setBpm(saved.bpm, true);
    if(typeof saved.vol === 'number'){ volSlider.value = String(saved.vol); }
  } else {
    setSteps('kick',  [0,8]);
    setSteps('snare', [4,12]);
    setSteps('chat',  [0,2,4,6,8,10,12,14]);
    setSteps('ohat',  [6,14]);
    setBpm(96, true);
  }

  // Minimal, read-only hook so the render can be verified in a real browser.
  window.__C40_TEST = {
    pattern, soundingStep,
    get playing(){return playing;},
    get currentStep(){return currentStep;} // scheduler look-ahead pointer (the OLD, buggy record target)
  };
})();
</script>
</body>
</html>
