<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memoria Infinita</title>
<meta name="description" content="Juego de memoria sin fin, adaptativo y diseñado para no cansar: sin cronómetro, sin derrota, se ajusta a tu ritmo.">
<style>
:root{
  --bg:#10151c; --bg2:#141b25; --surface:#172029; --surface2:#1d2833;
  --ink:#e9eef2; --muted:#8fa4b0; --line:#26333f;
  --accent:#57c7b8; --accent-ink:#08120f;
  --good:#6fce9f; --warm:#d9a86b;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:16px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef2f1; --bg2:#e6ece9; --surface:#ffffff; --surface2:#f3f6f5;
    --ink:#1b2730; --muted:#5b6d76; --line:#dbe3e1;
    --accent:#2f9e8f; --accent-ink:#ffffff;
    --good:#2f9e6b; --warm:#b07d38;
    --shadow:0 10px 28px rgba(31,58,52,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --bg2:#141b25; --surface:#172029; --surface2:#1d2833;
  --ink:#e9eef2; --muted:#8fa4b0; --line:#26333f;
  --accent:#57c7b8; --accent-ink:#08120f; --good:#6fce9f; --warm:#d9a86b;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#eef2f1; --bg2:#e6ece9; --surface:#ffffff; --surface2:#f3f6f5;
  --ink:#1b2730; --muted:#5b6d76; --line:#dbe3e1;
  --accent:#2f9e8f; --accent-ink:#ffffff; --good:#2f9e6b; --warm:#b07d38;
  --shadow:0 10px 28px rgba(31,58,52,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  min-height:100dvh; overflow-x:hidden;
}
/* ambient breathing ground — calm, never flashing */
body::before{
  content:""; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
  background:
    radial-gradient(38% 42% at 22% 18%, color-mix(in oklab,var(--accent) 22%,transparent), transparent 70%),
    radial-gradient(46% 50% at 82% 88%, color-mix(in oklab,var(--accent) 14%,transparent), transparent 72%),
    linear-gradient(var(--bg2),var(--bg));
  animation:breathe 14s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
main{width:min(720px,94vw); padding:clamp(1.2rem,4vw,2.4rem) 0 3rem; display:flex; flex-direction:column; gap:1.25rem}
header{text-align:center; display:flex; flex-direction:column; gap:.35rem}
h1{
  margin:0; font-size:clamp(1.9rem,6vw,2.9rem); font-weight:300;
  letter-spacing:.06em; text-wrap:balance;
}
h1 b{font-weight:600; color:var(--accent)}
.tagline{margin:0; color:var(--muted); font-size:.95rem; letter-spacing:.02em}
.hud{
  display:flex; justify-content:center; gap:.6rem; flex-wrap:wrap;
}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:.42rem 1rem; font-size:.86rem; color:var(--muted);
  display:flex; gap:.45rem; align-items:baseline;
}
.stat b{color:var(--ink); font-size:1.05rem; font-variant-numeric:tabular-nums}
.hud.hidden{display:none}
.board{
  display:grid; gap:clamp(.5rem,1.8vw,.85rem);
  grid-template-columns:repeat(var(--cols,4),1fr);
  perspective:1000px;
}
.card{
  appearance:none; border:0; background:none; padding:0; cursor:pointer;
  aspect-ratio:1/1; border-radius:var(--r); position:relative;
  transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.7,.2,1);
}
.card .inner{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card.revealed .inner{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; display:grid; place-items:center;
  border-radius:var(--r); backface-visibility:hidden;
  box-shadow:var(--shadow); border:1px solid var(--line);
}
.back{
  background:linear-gradient(150deg,var(--surface2),var(--surface));
  color:color-mix(in oklab,var(--accent) 60%,var(--muted));
  font-size:clamp(1.1rem,4vw,1.6rem);
}
.back::after{content:"◈"; opacity:.55}
.front{
  background:linear-gradient(150deg,var(--surface),var(--surface2));
  transform:rotateY(180deg); font-size:clamp(1.6rem,7vw,2.6rem);
}
.card:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.card[aria-disabled="true"]{cursor:default}
.card.matched .front{
  border-color:color-mix(in oklab,var(--good) 60%,var(--line));
  box-shadow:0 0 0 2px color-mix(in oklab,var(--good) 45%,transparent), var(--shadow);
  animation:settle .5s ease;
}
.card.miss .front{animation:nudge .5s ease}
@keyframes settle{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.05)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes nudge{0%,100%{transform:rotateY(180deg)}25%{transform:rotateY(180deg) translateX(-3px)}75%{transform:rotateY(180deg) translateX(3px)}}
.controls{display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; align-items:center}
.btn{
  font:inherit; cursor:pointer; border-radius:10px; padding:.55rem 1rem;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  transition:border-color .2s, background .2s;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.toggle{display:flex; align-items:center; gap:.45rem; color:var(--muted); font-size:.9rem; cursor:pointer}
.toggle input{width:1.05rem; height:1.05rem; accent-color:var(--accent)}
.msg{min-height:1.4rem; text-align:center; color:var(--accent); font-size:.95rem; letter-spacing:.02em}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.overlay{
  position:fixed; inset:0; display:none; place-items:center; z-index:5;
  background:color-mix(in oklab,var(--bg) 82%,transparent); backdrop-filter:blur(6px);
}
.overlay.on{display:grid}
.rest-card{
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  padding:2rem; max-width:min(420px,90vw); text-align:center; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:.8rem;
}
.rest-card h2{margin:0; font-weight:400}
.rest-card p{margin:0; color:var(--muted)}
footer{color:var(--muted); font-size:.8rem; text-align:center}
@media (prefers-reduced-motion: reduce){
  body::before{animation:none}
  .card,.card .inner{transition:none}
  .card.matched .front,.card.miss .front{animation:none}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Memoria <b>Infinita</b></h1>
    <p class="tagline">Sin final · sin cronómetro · se adapta a tu ritmo</p>
  </header>

  <div class="hud" id="hud">
    <span class="stat">Nivel <b id="s-level">3</b></span>
    <span class="stat">Ronda <b id="s-round">1</b></span>
    <span class="stat">Racha <b id="s-streak">0</b></span>
  </div>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div class="board" id="board" role="group" aria-label="Tablero de memoria"></div>

  <div class="controls">
    <button class="btn primary" id="rest" type="button">Descanso</button>
    <button class="btn" id="restart" type="button">Reiniciar nivel</button>
    <label class="toggle"><input type="checkbox" id="zen"> Modo zen</label>
    <label class="toggle"><input type="checkbox" id="theme"> Tema claro</label>
  </div>

  <footer>Empareja las cartas. Al completar el tablero avanzas: si aciertas limpio sube el nivel, si te cuesta baja. Nunca pierdes.</footer>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="rest-title">
  <div class="rest-card">
    <h2 id="rest-title">Descanso</h2>
    <p>Mira algo a 6 metros durante 20 segundos. Relaja los hombros. Respira.</p>
    <button class="btn primary" id="resume" type="button">Continuar</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var MIN=2, MAX=8, KEY="memoria.v1";
  var THEMES=[
    ["🌙","⭐","🌿","🍃","🌊","🐚","🕊️","🌸"],
    ["🫐","🍇","🍑","🍋","🥝","🍈","🫒","🍐"],
    ["🎐","🪷","🍵","🧿","🪸","🌾","🪶","🐋"],
    ["🔺","🔷","⬛","🟡","🟣","🟩","🔶","⬢"]
  ];
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var $=function(id){return document.getElementById(id)};
  var board=$("board"), msg=$("msg");
  var elLevel=$("s-level"), elRound=$("s-round"), elStreak=$("s-streak");

  var state=load();
  var cards=[], flipped=[], lock=false, matched=0, misses=0, themeIx=0;

  function load(){
    try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.level) return s; }catch(e){}
    return {level:3, round:1, streak:0, best:0, zen:false, light:false};
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function syncHud(){
    elLevel.textContent=state.level; elRound.textContent=state.round; elStreak.textContent=state.streak;
    $("hud").classList.toggle("hidden", !!state.zen);
  }

  function newRound(){
    var pairs=state.level;
    var set=THEMES[themeIx % THEMES.length].slice(0,pairs);
    themeIx++;
    var deck=shuffle(set.concat(set));
    cards=deck.map(function(sym,i){return {sym:sym, i:i, matched:false};});
    flipped=[]; lock=false; matched=0; misses=0;
    board.style.setProperty("--cols", Math.ceil(Math.sqrt(deck.length)));
    board.innerHTML="";
    cards.forEach(function(c){
      var b=document.createElement("button");
      b.className="card"; b.type="button"; b.dataset.i=c.i;
      b.setAttribute("aria-label","Carta oculta");
      b.innerHTML='<span class="inner"><span class="face back"></span><span class="face front">'+c.sym+'</span></span>';
      b.addEventListener("click", function(){ flip(c.i); });
      board.appendChild(b);
    });
    say("Nivel "+state.level+" · "+pairs+" parejas");
    syncHud();
  }

  function nodeOf(i){ return board.querySelector('.card[data-i="'+i+'"]'); }

  function flip(i){
    if(lock) return;
    var c=cards[i]; if(!c || c.matched) return;
    var el=nodeOf(i);
    if(el.classList.contains("revealed")) return;
    el.classList.add("revealed");
    el.setAttribute("aria-label","Carta con "+c.sym);
    flipped.push(i);
    if(flipped.length===2) compare();
  }

  function compare(){
    lock=true;
    var a=cards[flipped[0]], b=cards[flipped[1]];
    if(a.sym===b.sym){
      a.matched=b.matched=true; matched++;
      [a.i,b.i].forEach(function(i){
        var el=nodeOf(i); el.classList.add("matched");
        el.setAttribute("aria-disabled","true");
        el.setAttribute("aria-label","Pareja "+cards[i].sym);
      });
      flipped=[]; lock=false;
      if(matched===state.level) setTimeout(roundClear, reduce?150:520);
    }else{
      misses++;
      var els=flipped.map(nodeOf);
      els.forEach(function(el){ el.classList.add("miss"); });
      setTimeout(function(){
        els.forEach(function(el){
          el.classList.remove("revealed","miss");
          el.setAttribute("aria-label","Carta oculta");
        });
        flipped=[]; lock=false;
      }, reduce?700:900);
    }
  }

  // Flow-band adaptation: reward clean clears, ease off when it's a struggle.
  function roundClear(){
    var pairs=state.level;
    var clean = misses <= Math.ceil(pairs*0.34);
    var hard  = misses >= Math.ceil(pairs*1.5);
    var note;
    if(clean && state.level<MAX){ state.level++; state.streak++; note="Impecable — subes a nivel "+state.level; }
    else if(clean){ state.streak++; note="Impecable — racha "+state.streak; }
    else if(hard && state.level>MIN){ state.level--; state.streak=0; note="Bajamos un poco. Sin prisa."; }
    else { state.streak++; note="Tablero completado"; }
    state.round++;
    if(state.streak>state.best) state.best=state.streak;
    save();
    say("✔ "+note);
    setTimeout(newRound, reduce?250:650);
  }

  function say(t){ msg.textContent=t; }

  // ---- rest reminder (eye comfort) ----
  var active=0, paused=false;
  setInterval(function(){
    if(document.visibilityState!=="visible" || paused) return;
    active++;
    if(active % 300 === 0) openRest();
  }, 1000);

  function openRest(){ paused=true; $("overlay").classList.add("on"); $("resume").focus(); }
  function closeRest(){ paused=false; $("overlay").classList.remove("on"); }
  $("rest").addEventListener("click", openRest);
  $("resume").addEventListener("click", closeRest);
  $("overlay").addEventListener("keydown", function(e){ if(e.key==="Escape") closeRest(); });

  $("restart").addEventListener("click", function(){ newRound(); });

  var zen=$("zen"); zen.checked=!!state.zen;
  zen.addEventListener("change", function(){ state.zen=zen.checked; save(); syncHud(); });

  var theme=$("theme"); theme.checked=!!state.light;
  function applyTheme(){ document.documentElement.setAttribute("data-theme", state.light?"light":"dark"); }
  theme.addEventListener("change", function(){ state.light=theme.checked; save(); applyTheme(); });

  applyTheme();
  newRound();
})();
</script>
</body>
</html>
