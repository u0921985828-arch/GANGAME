# Despliegue de VistaViva en Netlify (sitio estático, sin build).
# Conecta este repo (privado también) en app.netlify.com y listo.
[build]
  publish = "."
  command = ""

# El service worker no debe cachearse para que las actualizaciones lleguen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
