name: Build Release AAB

# Compila el bundle de release (.aab) para subir a Google Play, firmado con la clave de subida.
# Manual (Actions ▸ Build Release AAB ▸ Run workflow). Requiere estos secrets del repo para firmar
# (Settings ▸ Secrets and variables ▸ Actions); sin ellos el build sale SIN firmar (no publicable):
#   RELEASE_KEYSTORE_BASE64  — el keystore de subida en base64
#   RELEASE_STORE_PASSWORD   — contraseña del almacén
#   RELEASE_KEY_ALIAS        — alias de la clave
#   RELEASE_KEY_PASSWORD     — contraseña de la clave
on:
  workflow_dispatch:
  push:
    branches: [ claude/new-session-q3zb92 ]
    paths:
      - 'android/**'
      - 'ARTiFACTSFX404_v*.html'
      - 'tools/**'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write   # publica el APK de release (firmado) en un Release → enlace de descarga directo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regenerate the SHIPPED asset as an OBFUSCATED build from the latest readable ARTiFACTSFX404_v*.html
      # before Gradle packages it — the Play bundle never ships readable app source.
      - name: Obfuscate & regenerate shipped WebView asset
        working-directory: tools
        run: |
          npm i --no-audit --no-fund
          node obfuscate-build.mjs

      # Persist the auto-generated DEV keystore across runs so the sideload APK keeps the SAME signature
      # build-to-build (installs update in place). Only used when no upload-key secret is configured.
      - name: Cache dev signing keystore
        uses: actions/cache@v4
        with:
          path: android/release.keystore
          key: fx404-dev-keystore-v1

      - name: Prepare signing keystore
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/release.keystore
            echo "SIGN_MODE=upload-secret" >> "$GITHUB_ENV"
            echo "Keystore de subida (secret) → firma de Play, estable."
          elif [ -f android/release.keystore ]; then
            echo "SIGN_MODE=dev-cached" >> "$GITHUB_ENV"
            echo "Keystore de DEV restaurado de caché → firma estable (sin secrets)."
          else
            echo "::warning::Sin secrets RELEASE_* — genero un keystore de DEV (se cachea) para que el APK salga FIRMADO e instalable. Para publicar en Play, añade los 4 secrets RELEASE_*."
            keytool -genkeypair -v -keystore android/release.keystore -alias fx404 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fx404dev -keypass fx404dev \
              -dname "CN=ARTiFACTS FX-404 DEV, OU=App, O=ARTiFACTS, C=ES"
            echo "SIGN_MODE=dev-new" >> "$GITHUB_ENV"
          fi

      - name: Build release bundle + APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # When signing with the auto DEV keystore (no upload-key secret), use its fixed dev passwords.
          if [ "${SIGN_MODE}" != "upload-secret" ]; then
            export RELEASE_STORE_PASSWORD=fx404dev
            export RELEASE_KEY_ALIAS=fx404
            export RELEASE_KEY_PASSWORD=fx404dev
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARTiFACTS-FX404-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename release APK
        run: |
          ls -l android/app/build/outputs/apk/release/
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK de release: $apk"
          cp "$apk" ARTiFACTS-FX404-release.apk

      # BARRERA: no publicar nunca un APK sin firmar (Android lo rechaza con "paquete no es válido").
      # Si faltan los secrets del keystore, Gradle produce app-release-unsigned.apk y apksigner falla aquí,
      # cortando el build ANTES de publicar. Se arregla añadiendo los 4 secrets RELEASE_* del repo.
      - name: Verify the release APK is signed (fail before publishing if not)
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $apksigner"
          if ! "$apksigner" verify --print-certs ARTiFACTS-FX404-release.apk; then
            echo "::error::El APK de release NO está firmado. Añade los secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS y RELEASE_KEY_PASSWORD en Settings ▸ Secrets ▸ Actions."
            exit 1
          fi

      # Publica el APK de RELEASE (firmado con la clave de subida) en un Release con tag fijo → enlace de
      # descarga directo y permanente. Al ser release firmado y no debug, Play Protect lo marca mucho menos.
      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK de ARTiFACTS FX-404 — última build (release firmada)
          body: |
            APK de **release** firmado con la clave de subida (se actualiza en cada build).
            Descárgalo abajo (`ARTiFACTS-FX404-release.apk`) e instálalo en el móvil.

            ⚠️ Si ya tenías puesta una versión ANTERIOR de prueba (debug), desinstálala UNA vez
            antes de instalar ésta (usan firmas distintas → si no, sale "app no instalada").
            A partir de aquí las siguientes actualizaciones se instalan encima sin desinstalar.
          files: ARTiFACTS-FX404-release.apk
          make_latest: false

      # Deja el Release apk-latest SÓLO con el APK de release firmado: borra cualquier otro asset
      # (p.ej. un ARTiFACTS-FX404-debug.apk antiguo) para que no haya confusión al descargar.
      - name: Prune stale APKs from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          rel=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/apk-latest")
          echo "$rel" | jq -r '.assets[] | select(.name != "ARTiFACTS-FX404-release.apk") | "\(.id) \(.name)"' \
          | while read -r id name; do
              echo "Borrando asset obsoleto: $name ($id)"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/releases/assets/$id"
            done
