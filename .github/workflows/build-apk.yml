name: Build APK

# Compila el APK (debug, instalable) de ARTiFACTS FX-404 desde el WebView wrapper en android/.
# Se dispara manualmente (Actions ▸ Run workflow) o al empujar cambios del proyecto Android.
on:
  workflow_dispatch:
  push:
    branches: [ claude/new-session-q3zb92 ]
    paths:
      - 'android/**'
      - 'ARTiFACTSFX404_v*.html'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write   # para publicar el APK en un Release (enlace de descarga directo)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regenerate the SHIPPED asset (android/app/src/main/assets/index.html) as an OBFUSCATED build from
      # the latest readable ARTiFACTSFX404_v*.html. The committed asset is only the dev copy; what ships is
      # always the obfuscated one produced here.
      - name: Obfuscate & regenerate shipped WebView asset
        working-directory: tools
        run: |
          npm i --no-audit --no-fund
          node obfuscate-build.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ARTiFACTS-FX404-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARTiFACTS-FX404-apk
          path: ARTiFACTS-FX404-debug.apk
          if-no-files-found: error

      # Publica el APK en un Release con tag fijo → enlace de descarga directo y permanente,
      # mucho más fácil de encontrar (sobre todo en el móvil) que los artifacts de Actions.
      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK de prueba (debug) — última build
          body: |
            APK debug instalable de ARTiFACTS FX-404 (se actualiza en cada build).
            Descárgalo abajo (`ARTiFACTS-FX404-debug.apk`) e instálalo en el móvil.
          files: ARTiFACTS-FX404-debug.apk
          make_latest: false
