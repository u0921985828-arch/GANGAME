name: Build APK

# Compila el APK (debug, instalable) de ARTiFACTS FX-404 desde el WebView wrapper en android/.
# Se dispara manualmente (Actions ▸ Run workflow) o al empujar cambios del proyecto Android.
on:
  workflow_dispatch:
  push:
    branches: [ claude/new-session-q3zb92 ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ARTiFACTS-FX404-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARTiFACTS-FX404-apk
          path: ARTiFACTS-FX404-debug.apk
          if-no-files-found: error
