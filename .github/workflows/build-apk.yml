name: Build APK

# Compila el APK (debug, instalable) de ARTiFACTS FX-404 desde el WebView wrapper en android/ y lo sube
# SÓLO como artifact de la ejecución (para depurar). El enlace de descarga directo permanente (tag
# apk-latest) lo publica build-release.yml con el APK de RELEASE firmado — no el debug de aquí.
# Se dispara manualmente (Actions ▸ Run workflow) o al empujar cambios del proyecto Android.
on:
  workflow_dispatch:
  push:
    branches: [ claude/new-session-q3zb92 ]
    paths:
      - 'android/**'
      - 'ARTiFACTSFX404_v*.html'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read   # sólo sube el APK debug como artifact; el enlace fijo apk-latest lo publica build-release.yml (release firmado)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regenerate the SHIPPED asset (android/app/src/main/assets/index.html) as an OBFUSCATED build from
      # the latest readable ARTiFACTSFX404_v*.html. The committed asset is only the dev copy; what ships is
      # always the obfuscated one produced here.
      - name: Obfuscate & regenerate shipped WebView asset
        working-directory: tools
        run: |
          npm i --no-audit --no-fund
          node obfuscate-build.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ARTiFACTS-FX404-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARTiFACTS-FX404-apk
          path: ARTiFACTS-FX404-debug.apk
          if-no-files-found: error
